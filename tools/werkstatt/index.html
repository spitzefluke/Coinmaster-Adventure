<title>Welten-Werkstatt</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Grenze+Gotisch:wght@500;700&family=JetBrains+Mono:wght@400;600&family=Fredoka+One&family=Montserrat:wght@500;600;700;900&family=Marcellus+SC&display=swap">
<style>
  /* Werkstatt-Layout: links die Reihenfolge der Welten, rechts die große Roblox-Ansicht mit dem Urteil darunter.
     Bewusst nur dunkel: wie die Spiel-Vorschau des Projekts (Nachtblau, Münzgold). */
  :root {
    --night: #0d0b16;
    --panel: #171425;
    --panel-2: #201c33;
    --line: #2e2945;
    --ink: #f3ecdc;
    --ink-soft: #b7aec8;
    --ink-faint: #7d7494;
    --gold: #f2c14e;
    --gold-deep: #c8901e;
    --ok: #5fd38d;
    --wait: #7ad0ff;
    --lock: #4a4462;
    --display: "Grenze Gotisch", Georgia, serif;
    --body: "Barlow", "Segoe UI", system-ui, sans-serif;
    --mono: "JetBrains Mono", ui-monospace, monospace;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { background: var(--night); color: var(--ink); }
  body { font-family: var(--body); font-size: 15px; line-height: 1.5; }
  button, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

  .wrap { max-width: 1480px; margin: 0 auto; padding-block: 18px 40px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 18px; }

  /* Kopf */
  .top { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 14px 28px; }
  .brand small { display: block; font-family: var(--mono); font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--gold); }
  .brand h1 { margin: 2px 0 0; font-family: var(--display); font-weight: 700; font-size: clamp(30px, 4vw, 44px); line-height: 1; text-wrap: balance; }
  .progress { min-width: min(100%, 340px); display: grid; gap: 6px; }
  .progress .label { display: flex; justify-content: space-between; gap: 12px; font-size: 13px; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
  .progress .label b { color: var(--ink); font-weight: 600; }
  .bar { height: 8px; border-radius: 99px; background: var(--panel-2); overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--gold-deep), var(--gold)); border-radius: inherit; transition: width .5s ease; }

  /* Abläufe: Welten, Deko, Umgebung */
  .tracks { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }
  .track { display: grid; gap: 2px; text-align: left; padding: 10px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel); }
  .track b { font-size: 15px; }
  .track span { font-size: 12.5px; color: var(--ink-faint); }
  .track em { font-style: normal; font-family: var(--mono); font-size: 11px; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
  .track:hover { border-color: var(--ink-faint); }
  .track[aria-selected="true"] { border-color: var(--gold); background: color-mix(in srgb, var(--gold) 9%, var(--panel)); }
  .track[aria-selected="true"] em { color: var(--gold); }
  .tool.layer::before { content: ""; display: inline-block; width: 9px; height: 9px; margin-right: 6px; border-radius: 3px; border: 1.5px solid currentColor; vertical-align: 0; }
  .tool.layer[aria-pressed="true"]::before { background: currentColor; }
  .tool.layer[aria-pressed="true"] { background: rgba(13, 11, 22, .72); color: var(--ink); border-color: var(--gold); }
  .tool.layer[aria-pressed="false"] { color: var(--ink-faint); }
  .tools .sep { width: 1px; background: rgba(255, 255, 255, .18); margin: 2px 4px; }

  .grid { display: grid; grid-template-columns: 270px minmax(0, 1fr); gap: 18px; align-items: start; }

  /* Reihenfolge der Welten */
  .list { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 10px; max-height: calc(100vh - 140px); overflow: auto; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px); }
  .group { margin: 10px 6px 4px; font-family: var(--mono); font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-faint); display: flex; align-items: center; gap: 8px; }
  .group:first-child { margin-top: 2px; }
  .group::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--dot, var(--ink-faint)); }
  .w { width: 100%; display: grid; grid-template-columns: 26px minmax(0, 1fr) auto; align-items: center; gap: 8px; padding: 7px 8px; border: 1px solid transparent; border-radius: 9px; background: none; text-align: left; }
  .w .n { font-family: var(--mono); font-size: 11px; color: var(--ink-faint); text-align: right; font-variant-numeric: tabular-nums; }
  .w .name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .w:hover:not([aria-disabled="true"]) { background: var(--panel-2); }
  .w[aria-current="true"] { border-color: var(--gold); background: color-mix(in srgb, var(--gold) 10%, transparent); }
  .w[aria-disabled="true"] { cursor: not-allowed; color: var(--ink-faint); }
  .chip { font-family: var(--mono); font-size: 10px; letter-spacing: .06em; text-transform: uppercase; padding: 2px 7px; border-radius: 99px; white-space: nowrap; }
  .chip.ok { background: color-mix(in srgb, var(--ok) 18%, transparent); color: var(--ok); }
  .chip.now { background: var(--gold); color: #2a1c00; font-weight: 600; }
  .chip.wait { background: color-mix(in srgb, var(--wait) 16%, transparent); color: var(--wait); }
  .chip.lock { color: var(--ink-faint); border: 1px solid var(--lock); }

  /* Bühne */
  .stage { display: grid; gap: 14px; min-width: 0; }
  .viewer { position: relative; aspect-ratio: 16 / 9.5; max-height: 72vh; width: 100%; border-radius: 16px; overflow: hidden; background: radial-gradient(120% 90% at 50% 20%, #2a2346, var(--night)); border: 1px solid var(--line); }
  .viewer canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  .badge { position: absolute; top: 12px; left: 12px; display: flex; gap: 8px; flex-wrap: wrap; }
  .badge span { font-family: var(--mono); font-size: 11px; padding: 4px 9px; border-radius: 99px; background: rgba(13, 11, 22, .72); color: var(--ink); backdrop-filter: blur(6px); }
  .tools { position: absolute; left: 12px; right: 12px; bottom: 12px; display: flex; flex-wrap: wrap; gap: 6px; }
  .tool { padding: 6px 12px; border-radius: 99px; border: 1px solid rgba(255, 255, 255, .14); background: rgba(13, 11, 22, .72); backdrop-filter: blur(6px); font-size: 13px; font-weight: 600; }
  .tool:hover { border-color: var(--gold); }
  .tool[aria-pressed="true"] { background: var(--gold); color: #2a1c00; border-color: var(--gold); }
  .tpflash { position: absolute; inset: 0; background: #fff8e6; opacity: 0; pointer-events: none; transition: opacity .22s ease-out; }
  .tpflash.on { opacity: 1; transition: opacity .12s ease-in; }
  .loading { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(13, 11, 22, .55); backdrop-filter: blur(3px); font-family: var(--mono); font-size: 13px; color: var(--ink-soft); }
  .loading .coin { width: 42px; height: 42px; margin: 0 auto 12px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff1b8, var(--gold) 45%, var(--gold-deep)); animation: spin 1.1s linear infinite; }
  @keyframes spin { to { transform: rotateY(360deg); } }
  @media (prefers-reduced-motion: reduce) { .loading .coin { animation: none; } .bar i { transition: none; } }

  /* Urteil */
  .review { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr); gap: 14px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 18px; min-width: 0; display: grid; gap: 10px; align-content: start; }
  .eyebrow { font-family: var(--mono); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--gold); }
  .card h2 { margin: 0; font-family: var(--display); font-size: 34px; line-height: 1.05; font-weight: 700; }
  .card p { margin: 0; color: var(--ink-soft); max-width: 62ch; }
  .facts { display: flex; flex-wrap: wrap; gap: 6px 16px; font-family: var(--mono); font-size: 12px; color: var(--ink-faint); font-variant-numeric: tabular-nums; }
  .facts b { color: var(--ink); font-weight: 600; }
  label.h { font-weight: 600; }
  textarea { width: 100%; min-height: 112px; resize: vertical; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--night); line-height: 1.45; }
  textarea:focus { border-color: var(--gold); outline: none; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .btn { padding: 9px 16px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel-2); font-weight: 600; }
  .btn:hover { border-color: var(--ink-faint); }
  .btn.primary { background: linear-gradient(180deg, #ffd978, var(--gold)); color: #2a1c00; border-color: var(--gold-deep); }
  .btn.primary:hover { filter: brightness(1.05); }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .hint { font-size: 13px; color: var(--ink-faint); }
  .reply { border-left: 3px solid var(--wait); background: color-mix(in srgb, var(--wait) 7%, transparent); padding: 10px 12px; border-radius: 0 10px 10px 0; }
  .reply b { display: block; font-size: 12px; font-family: var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--wait); margin-bottom: 2px; }
  .reply div { white-space: pre-wrap; }
  .done { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 10px; background: color-mix(in srgb, var(--ok) 12%, transparent); color: var(--ok); font-weight: 600; }
  .note { font-size: 13px; color: var(--ink-faint); padding: 8px 10px; border: 1px dashed var(--line); border-radius: 10px; }
  .toast { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 22px); transform: translateX(-50%); background: var(--panel-2); border: 1px solid var(--gold); color: var(--ink); padding: 10px 16px; border-radius: 12px; font-weight: 600; max-width: calc(100% - 32px); z-index: 20; }

  @media (max-width: 900px) {
    .grid { grid-template-columns: minmax(0, 1fr); }
    .list { position: static; max-height: none; display: flex; gap: 6px; overflow-x: auto; padding: 8px; }
    .group { display: none; }
    .w { flex: 0 0 auto; width: auto; grid-template-columns: auto auto; }
    .w .n { display: none; }
    .review { grid-template-columns: minmax(0, 1fr); }
    .viewer { aspect-ratio: 4 / 3.4; }
    .tracks { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .track span { display: none; }
  }
</style>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <small>Coinmaster Adventure</small>
      <h1>Welten-Werkstatt</h1>
    </div>
    <div class="progress" aria-live="polite">
      <div class="label"><span id="prog-text">Fortschritt wird geladen …</span><b id="prog-num"></b></div>
      <div class="bar"><i id="prog-bar"></i></div>
    </div>
  </header>

  <div class="tracks" role="tablist" aria-label="Ablauf wählen">
    <button class="track" role="tab" type="button" data-track="welt"><b>Insel</b><span>Boden, Wege, Plätze, Wasser, Fels darunter</span><em id="tp-welt"></em></button>
    <button class="track" role="tab" type="button" data-track="gebaeude"><b>Gebäude</b><span>Häuser, Läden, Portale, Türme, Mauern</span><em id="tp-gebaeude"></em></button>
    <button class="track" role="tab" type="button" data-track="deko"><b>Deko</b><span>Bäume, Büsche, Blumen, Felsen, Kisten …</span><em id="tp-deko"></em></button>
    <button class="track" role="tab" type="button" data-track="umgebung"><b>Umgebung</b><span>Schwebeinseln, Berge, Wolken, Wahrzeichen am Horizont</span><em id="tp-umgebung"></em></button>
    <button class="track" role="tab" type="button" data-track="portal"><b>Portale</b><span>Portal jeder Welt im Spawn und der Teleport dorthin</span><em id="tp-portal"></em></button>
  </div>

  <div class="grid">
    <nav class="list" id="list" aria-label="Welten der Reihe nach"></nav>

    <section class="stage">
      <div class="viewer">
        <canvas id="viewer" aria-label="3D-Ansicht der Welt, wie in Roblox"></canvas>
        <div class="badge"><span id="b-pos"></span><span id="b-parts"></span><span id="b-models" hidden>Häuser, Bäume und Felsen laden …</span></div>
        <div class="tools">
          <button class="tool" id="t-home" type="button">Startansicht</button>
          <button class="tool" id="t-top" type="button">Draufsicht</button>
          <button class="tool" id="t-low" type="button">Spielerhöhe</button>
          <button class="tool" id="t-rot" type="button" aria-pressed="true">Drehen</button>
          <button class="tool" id="t-fig" type="button" aria-pressed="false">Figur zum Vergleich</button>
          <button class="tool" id="t-tp" type="button" hidden>Teleport abspielen</button>
          <span class="sep" aria-hidden="true"></span>
          <button class="tool layer" id="l-geb" type="button" aria-pressed="true">Gebäude</button>
          <button class="tool layer" id="l-deko" type="button" aria-pressed="true">Deko</button>
          <button class="tool layer" id="l-umg" type="button" aria-pressed="true">Umgebung</button>
        </div>
        <div class="tpflash" id="tpflash"></div>
        <div class="loading" id="loading"><div><div class="coin"></div><span id="loading-text">Engine wird geladen …</span></div></div>
      </div>

      <div class="review">
        <article class="card">
          <div class="eyebrow" id="w-planet"></div>
          <h2 id="w-name">Spawn</h2>
          <p id="w-text"></p>
          <div class="facts" id="w-facts"></div>
        </article>

        <article class="card" id="judge">
          <label class="h" for="wish" id="wish-label">Was soll sich an dieser Welt ändern?</label>
          <textarea id="wish" placeholder="Zum Beispiel: Der Brunnen soll größer werden, mehr Bäume am Rand, die Läden bunter …"></textarea>
          <div class="row">
            <button class="btn" id="save" type="button">Wunsch speichern</button>
            <span class="hint" id="save-state"></span>
          </div>
          <div class="reply" id="reply" hidden><b>Claude</b><div id="reply-text"></div></div>
          <div id="verdict"></div>
          <div class="note" id="store-note" hidden></div>
        </article>
      </div>
    </section>
  </div>
</div>
<div class="toast" id="toast" hidden></div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
import { OrbitControls } from './vendor/OrbitControls.js';

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
let toastTimer = 0;
function toast(msg) {
  const t = $('toast');
  t.textContent = msg;
  t.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => (t.hidden = true), 3200);
}

// ── Engine laden (Module des Projekts) ──
let W, F, RW;
try {
  [W, F, RW] = await Promise.all([import('./welten/js/worlds.js'), import('./welten/js/worldFactory.js'), import('./welten/js/robloxWorld.js')]);
} catch (e) {
  console.error(e);
  $('loading-text').textContent = 'Die 3D-Engine konnte nicht geladen werden. Bitte die Seite neu laden.';
  throw e;
}
const { WORLDS, planetById, galaxyById } = W;
const ALL = WORLDS.filter((w) => !w.soon);
// Reihenfolge je Ablauf: die Portale gibt es für jede Welt außer dem Spawn selbst
const orderOf = (t) => (t === 'portal' ? ALL.filter((w) => !w.hub) : ALL);
let ORDER = ALL;
const STUDS = 8;

// ── Fortschritt: geteilte Daten (db), sonst nur in diesem Browser ──
const docs = {}; // id → { status, wish, wishAt, reply, replyAt }
let db = null, storeReady = false;
const LOCAL = 'werkstatt.welten';
function loadLocal() {
  try { Object.assign(docs, JSON.parse(localStorage.getItem(LOCAL) || '{}')); } catch {}
}
function saveLocal() {
  try { localStorage.setItem(LOCAL, JSON.stringify(docs)); } catch {}
}
const queues = {};
function writeDoc(id, patch) {
  docs[id] = { ...(docs[id] || {}), ...patch };
  render();
  if (!db) { saveLocal(); return Promise.resolve(); }
  const body = { ...docs[id] };
  queues[id] = (queues[id] || Promise.resolve()).then(() => db.collection('welten').doc(id).set(body)).catch((e) => {
    console.error(e);
    toast(e?.code === 'not_granted' || e?.code === 'permission_denied' ? 'Du kannst hier nur ansehen, nicht speichern.' : 'Speichern hat nicht geklappt. Bitte nochmal versuchen.');
  });
  return queues[id];
}

// Drei Abläufe, jeder mit eigener Reihenfolge, eigenen Wünschen und eigenem Absegnen
const TRACKS = {
  welt: { name: 'Insel', short: 'Insel von ', label: 'Was soll sich an der Insel ändern (Boden, Wege, Plätze, Wasser, Form)?', placeholder: 'Zum Beispiel: Die Insel größer, breitere Wege, ein See in der Mitte, mehr Hügel …', layers: { gebaeude: true, deko: true, umgebung: true } },
  gebaeude: { name: 'Gebäude', short: 'Gebäude von ', label: 'Was soll sich an den Gebäuden ändern?', placeholder: 'Zum Beispiel: Der Brunnen größer, die Läden bunter, ein zweiter Turm am Tor …', layers: { gebaeude: true, deko: false, umgebung: false } },
  deko: { name: 'Deko', short: 'Deko von ', label: 'Was soll sich an der Deko ändern?', placeholder: 'Zum Beispiel: Mehr Bäume am Rand, weniger Kisten, Blumen in Gelb und Weiß …', layers: { gebaeude: true, deko: true, umgebung: false } },
  portal: { name: 'Portal', short: 'Portal von ', label: 'Was soll sich am Portal oder an der Teleport-Animation ändern?', placeholder: 'Zum Beispiel: Das Portal größer, der Strudel schneller, eine hellere Lichtsäule bei der Ankunft …', layers: { gebaeude: true, deko: true, umgebung: true } },
  umgebung: { name: 'Umgebung', short: 'Umgebung von ', label: 'Was soll sich an der Umgebung ändern?', placeholder: 'Zum Beispiel: Mehr Schwebeinseln, die Berge weiter weg, rosa Wolken bei Sonnenuntergang …', layers: { gebaeude: true, deko: true, umgebung: true } },
};
let track = 'welt';
const docId = (id, t = track) => (t === 'welt' ? id : `${t}-${id}`);
const approved = (id, t = track) => docs[docId(id, t)]?.status === 'gefaellt';
const currentIndex = (t = track) => {
  const O = orderOf(t), i = O.findIndex((w) => !approved(w.id, t));
  return i < 0 ? O.length : i;
};
const unlocked = (i, t = track) => i <= currentIndex(t) || approved(orderOf(t)[i].id, t);
let selected = null; // Welt-Id in der Ansicht

// ── Liste ──
function groupName(w) {
  if (w.planet === 'hub') return { name: 'Treffpunkt', color: '#f2c14e' };
  const p = planetById[w.planet];
  return { name: `${p.name} · ${p.title}`, color: p.color };
}
function render() {
  const cur = currentIndex();
  const n = ORDER.filter((w) => approved(w.id)).length;
  const T = TRACKS[track];
  $('prog-text').textContent = cur >= ORDER.length ? `${T.name}: alles abgesegnet` : `${T.name} · gerade dran: ${ORDER[cur].name}`;
  $('prog-num').textContent = `${n} von ${ORDER.length} abgesegnet`;
  for (const t of Object.keys(TRACKS)) {
    const O = orderOf(t), k = O.filter((w) => approved(w.id, t)).length;
    $('tp-' + t).textContent = `${k} / ${O.length} abgesegnet`;
    document.querySelector(`.track[data-track="${t}"]`).setAttribute('aria-selected', String(t === track));
  }
  $('prog-bar').style.width = `${(n / ORDER.length) * 100}%`;

  let html = '', last = '';
  ORDER.forEach((w, i) => {
    const g = groupName(w);
    if (g.name !== last) {
      html += `<div class="group" style="--dot:${g.color}">${esc(g.name)}</div>`;
      last = g.name;
    }
    const d = docs[docId(w.id)] || {};
    const open = unlocked(i);
    let chip;
    if (approved(w.id)) chip = '<span class="chip ok">gefällt</span>';
    else if (i === cur) chip = waiting(d) ? '<span class="chip wait">Wunsch offen</span>' : '<span class="chip now">dran</span>';
    else chip = '<span class="chip lock">später</span>';
    html += `<button class="w" type="button" data-id="${w.id}" data-i="${i}" aria-current="${w.id === selected}" aria-disabled="${!open}"><span class="n">${i + 1}</span><span class="name">${esc(w.name)}</span>${chip}</button>`;
  });
  $('list').innerHTML = html;
  $('list').querySelector('[aria-current="true"]')?.scrollIntoView({ block: 'nearest', inline: 'nearest' });
  renderJudge();
}
const waiting = (d) => d.wish && (!d.replyAt || (d.wishAt || 0) > d.replyAt);

$('list').addEventListener('click', (e) => {
  const b = e.target.closest('.w');
  if (!b) return;
  const i = +b.dataset.i;
  if (!unlocked(i)) {
    toast(`Erst „${TRACKS[track].short}${ORDER[currentIndex()].name}“ absegnen, dann geht es weiter.`);
    return;
  }
  show(ORDER[i].id);
});
document.querySelector('.tracks').addEventListener('click', (e) => {
  const b = e.target.closest('.track');
  if (!b || b.dataset.track === track) return;
  setTrack(b.dataset.track);
});
function setTrack(t, id) {
  if (wishDirty) saveWish();
  stopTeleport();
  track = t;
  ORDER = orderOf(t);
  $('t-tp').hidden = t !== 'portal';
  const T = TRACKS[t];
  $('wish-label').textContent = T.label;
  $('wish').placeholder = T.placeholder;
  Object.assign(layerOn, T.layers);
  // in jedem Ablauf weiter bei der Welt, die gerade dran ist (oder der gewünschten, wenn sie offen ist)

// ── Portale und Teleport-Animation ──
// buildTarget: welche Welt die Ansicht baut (im Ablauf „Portale“ immer der Spawn)
function buildTarget(id, t = track) {

}

  // Eingang der Halle (Bereich „portale-…“, der dem Portal am nächsten liegt): von dort sieht man in die Halle
  const halls = built.data.meta.areas.filter((a) => a.id.startsWith('portale-'));
  const hall = halls.reduce((b, a) => (Math.hypot(a.pos[0] - pos.x, a.pos[2] - pos.z) < Math.hypot(b.pos[0] - pos.x, b.pos[2] - pos.z) ? a : b), halls[0]);
  const door = new THREE.Vector3(hall.pos[0], pos.y, hall.pos[2]);
  const r = disc.rot;
  let n = new THREE.Vector3(r[2], 0, r[8]).normalize();
  if (n.dot(door.clone().sub(pos)) < 0) n.negate(); // Vorderseite: zur Hallenmitte und zum Eingang
  const radius = disc.size ? Math.max(disc.size[0], disc.size[2] ?? 0) / 2 : 6.6;
  portal = { id, pos, n, door, radius: Math.max(4, Math.min(radius, 9)), feetY: pos.y - 10.3, world: ALL.find((w) => w.id === id) };
  controls.autoRotate = false;
  $('t-rot').setAttribute('aria-pressed', 'false');
  controls.minDistance = 2 * STUDS;
  // mittig vor dem Portal in der Halle (unter dem Hallenschild, zwischen den Torpfeilern)
  // Kamera: mehrere Plätze vor dem Portal ausprobieren und den mit freier Sicht nehmen (Teile der Halle,
  // Rakete oder Brunnen dürfen nicht zwischen Kamera und Portal stehen)
  const side0 = new THREE.Vector3(-n.z, 0, n.x);
  const near = built.data.parts.filter((p) => p.size && Math.hypot(p.pos[0] - pos.x, p.pos[2] - pos.z) < 70 && Math.hypot(p.pos[0] - pos.x, p.pos[1] - pos.y, p.pos[2] - pos.z) > 11)
    .map((p) => ({ c: new THREE.Vector3(...p.pos), r: Math.max(...p.size) * 0.42 }));
  const blocked = (eye, target) => {
    const d = target.clone().sub(eye), len = d.length();
    d.divideScalar(len);
    let hits = 0;
    for (const o of near) {
      const t = Math.max(0, Math.min(len, o.c.clone().sub(eye).dot(d)));
      if (eye.clone().addScaledVector(d, t).distanceTo(o.c) < o.r) hits += o.r;
    }

  let best = null;

      for (const up of [7, 15]) {
        const e = cand(dist, sideOff, up), cost = blocked(e, pos) + blocked(e, pos.clone().add(new THREE.Vector3(0, -8, 0))) + Math.abs(sideOff) * 0.05 + up * 0.05;

  const eye = best.e;
  fly = { t: 0, fromT: controls.target.clone(), toT: pos.clone().add(new THREE.Vector3(0, -2, 0)), fromP: camera.position.clone(), toP: eye };

}
// Figur ohne Leuchtsäule und Namensschild (die gehören nur zum Größenvergleich)
function tpFigure(at, faceTo) {
  const m = RW.addFigure(built.rw, at, faceTo);
  for (const c of [...m.children]) {
    if (c.props?.Name === 'Markierung') c.setParent(null);
    for (const g of [...(c.children || [])]) if (g.ClassName === 'BillboardGui') g.setParent(null);
  }
  const parts = m.children.filter((c) => c.props?.CFrame);

    m.elements[12] += offset.x;
    m.elements[13] += offset.y + lift;

function teleportStep(dt) {

  if (tp.phase === 'walk') {
    const k = Math.min(1, tp.t / 1.6);
    const p = tp.start.clone().lerp(tp.end, k);
    poseFigure(tp.fig, new THREE.Vector3(p.x - tp.start.x, 0, p.z - tp.start.z), 0, Math.abs(Math.sin(k * 14)) * 0.35);
    if (k >= 1) {

    }

function resize() {

    fly.t = Math.min(1, fly.t + dt / 1.2);
    const k = fly.t < 0.5 ? 2 * fly.t * fly.t : 1 - Math.pow(-2 * fly.t + 2, 2) / 2;

  }
  for (const k of Object.keys(docs)) delete docs[k]; // der geteilte Stand zählt
  const timer = setTimeout(() => { note.hidden = false; note.textContent = 'Der gespeicherte Fortschritt ist gerade nicht erreichbar. Was du jetzt änderst, wird nachgetragen, sobald die Verbindung steht.'; }, 10000);
  let first = true;
  db.collection('welten').onSnapshot((snap) => {
    if (!snap.metadata.fromCache) { clearTimeout(timer); note.hidden = true; }
    for (const d of snap.docs) docs[d.id] = { ...d.data() };
    for (const c of snap.docChanges()) if (c.type === 'removed') delete docs[c.doc.id];
    storeReady = true;
    if (first) {
      first = false;
      const want = startId();
      if (want !== selected) { show(want); return; }
    }
    render();
  }, (e) => {
    clearTimeout(timer);
    note.hidden = false;
    note.textContent = 'Der gespeicherte Fortschritt konnte nicht geladen werden. Bitte die Seite neu laden.';
    console.error(e);
  });
})();
</script>
