<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Coinmaster Adventure</title>
<meta name="description" content="Vorschauen aus der Entwicklung von Coinmaster Adventure.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Grenze+Gotisch:wght@500;700&family=JetBrains+Mono:wght@400;600&family=Marcellus+SC&display=swap">
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/start.css">
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div class="page">
  <header class="hero">
    <div class="hero-text">
      <p class="eyebrow">In Entwicklung</p>
      <h1>Coinmaster Adventure</h1>
      <p class="lede">Hier sammeln wir alles, was wir für das Spiel bauen. Jeder Bereich ist eine eigene Vorschau, die du direkt im Browser ausprobieren kannst.</p>
    </div>
    <figure class="hero-coin">
      <a href="muenzen/" class="hero-stage" aria-label="Zum Münzkabinett"><canvas id="hero-canvas"></canvas></a>
      <figcaption id="hero-caption">Zufallsmünze aus dem Münzkabinett</figcaption>
    </figure>
  </header>

  <section class="areas" aria-labelledby="areas-title">
    <h2 id="areas-title">Bereiche</h2>
    <div id="area-grid" class="area-grid"></div>
  </section>

  <footer class="foot">Coinmaster Adventure · Gerendert mit three.js</footer>
</div>

<script type="module" src="js/start.js"></script>
</body>
</html>
